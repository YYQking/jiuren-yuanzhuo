<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>九人圆桌 · 赌桌原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-face="yang">
<div class="stage" id="stage">

  <!-- 顶栏：牌桌名 + 这一局的议题 + 进度 -->
  <header class="topbar">
    <div class="brand">
      <span class="mark">九人圆桌</span>
      <span class="divider"></span>
      <span class="table-name" id="tableName"></span>
    </div>
    <h1 class="topic" id="topic"></h1>
    <div class="counter">
      <span id="counter"></span>
      <span class="hint" id="hint">点一下开始</span>
    </div>
  </header>

  <!-- 荷官说话时这行亮起来（他不在桌上坐） -->
  <div class="voiceover" id="voiceover">
    <span class="vo-label">荷官 · 画外音</span>
    <span class="vo-line"></span>
  </div>

  <main class="floor">
    <!-- 桌子正上方那盏灯 -->
    <div class="lamp" aria-hidden="true">
      <span class="cord"></span>
      <span class="shade"><span class="bulb"></span></span>
      <span class="halo"></span>
    </div>

    <!-- 绿绒赌桌：金边、绒面、中央底池 -->
    <div class="table" id="table">
      <div class="rail"></div>
      <div class="felt"></div>
      <div class="bet-line"></div>
      <div class="pot">
        <div class="pot-chips" id="potChips"></div>
        <div class="plaque">
          <b class="seal" id="plateSeal">壹</b>
          <span id="platePhase">开局</span>
          <small id="plateCount">八人围坐</small>
        </div>
      </div>
      <div class="dealer" id="dealer">
        <span class="shoe"></span>
        <b>荷官</b>
      </div>
    </div>

    <div class="seats" id="seats"></div>
    <svg class="replies" id="replies"></svg>
  </main>

  <!-- 发言卡片：像一张甩到桌边的牌 -->
  <section class="speech" id="speech">
    <div class="speech-head">
      <span class="who" id="who"></span>
      <span class="face-chip" id="faceChip"></span>
      <span class="intent-chip" id="intentChip"></span>
      <span class="reply-chip" id="replyChip"></span>
      <span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="speech-body" id="body"></div>
    <div class="speech-foot">
      <span class="legend"><b class="c-solid">我确定</b><b class="c-heard">我听说</b><b class="c-guess">我猜</b></span>
      <span class="keys">点一下 / 空格 = 下一条 &nbsp;·&nbsp; ← = 回看</span>
    </div>
  </section>

  <p class="notice">原型演示，不联网、不调模型。20 条发言来自一场真实跑测。</p>
</div>

<script src="data.js"></script>
<script src="stage.js"></script>
</body>
</html>
